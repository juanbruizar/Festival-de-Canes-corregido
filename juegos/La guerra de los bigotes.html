<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La guerra de los Bigotes: Perros VS Gatos</title>

  <style>
    /* ============================================
       PERSONALIZACIÓN DE COLORES
       Cambiá los valores de abajo para cambiar
       los colores de todo el juego.
       ============================================ */
    :root {
      --color-fondo:       #252932;                    /* fondo de la página */
      --color-tablero:     #2c313c;                    /* fondo del tablero (variante del oscuro) */
      --color-celda:       #3a4150;                    /* fondo de cada casillero */
      --color-borde:       #cb9e6a;                    /* bordes y botones */
      --color-texto:       #cb9e6a;                    /* color de los textos */
      --color-texto-boton: #252932;                    /* texto de los botones principales */
      --color-ganador:     rgba(203, 158, 106, 0.35);  /* casilleros de la línea ganadora */
      --color-cartel:      #3a4150;                    /* fondo del cartel de victoria */
    }

    /* ============================================
       ESTILOS GENERALES (no hace falta tocar)
       ============================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Comic Sans MS", "Segoe UI", sans-serif;
      background: var(--color-fondo);
      color: var(--color-texto);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 18px;
      padding: 20px;
    }

    h1 {
      font-size: 1.9rem;
      text-align: center;
      line-height: 1.3;
    }

    /* El "Perros VS Gatos" debajo del título */
    h1 .subtitulo {
      display: block;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .oculta { display: none !important; }

    .pantalla {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Botones principales */
    .btn-grande {
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: var(--color-borde);
      color: var(--color-texto-boton);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-grande:hover { transform: scale(1.05); }

    /* Botones secundarios (volver al menú, etc.) */
    .btn-secundario {
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      padding: 8px 20px;
      border: 3px solid var(--color-borde);
      border-radius: 999px;
      background: transparent;
      color: var(--color-texto);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-secundario:hover { transform: scale(1.05); }

    /* Botones para elegir personaje */
    #opciones-personaje { display: flex; gap: 20px; }
    .btn-personaje {
      font-size: 1.2rem;
      font-weight: bold;
      width: 110px;
      height: 110px;
      border: 4px solid var(--color-borde);
      border-radius: 20px;
      background: var(--color-celda);
      color: var(--color-texto);
      cursor: pointer;
      transition: transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-personaje:hover { transform: scale(1.08); }

    /* Texto que dice de quién es el turno */
    #estado {
      font-size: 1.3rem;
      min-height: 1.6em;
      font-weight: bold;
    }

    /* El tablero: grilla de 3x3 */
    #tablero {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      background: var(--color-tablero);
      border: 6px solid var(--color-borde);
      border-radius: 16px;
      padding: 10px;
    }

    /* Cada casillero */
    .celda {
      background: var(--color-celda);
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1.1rem;          /* tamaño del texto de respaldo si no hay imagen */
      font-weight: bold;
      color: var(--color-texto);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.2s;
    }
    .celda:hover  { transform: scale(1.05); }
    .celda.ganadora { background: var(--color-ganador); }

    /* Estilo de las imágenes usadas como símbolo */
    .simbolo-img {
      object-fit: cover;
      border-radius: 15%;
      vertical-align: middle;
      display: inline-block;
    }
    h1 .simbolo-img             { width: 1.5em; height: 1.5em; }
    .celda .simbolo-img         { width: 80px;  height: 80px; }
    .btn-personaje .simbolo-img { width: 86px;  height: 86px; }
    #cartel-emoji .simbolo-img  { width: 100px; height: 100px; }
    #marcador .simbolo-img,
    #estado .simbolo-img        { width: 1.4em; height: 1.4em; }

    /* Marcador de puntos */
    #marcador {
      display: flex;
      gap: 24px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* ============================================
       CARTEL DE VICTORIA (pantalla completa)
       ============================================ */
    #cartel-victoria {
      position: fixed;
      inset: 0;                            /* cubre toda la pantalla */
      background: rgba(0, 0, 0, 0.45);     /* fondo oscuro semitransparente */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .cartel {
      background: var(--color-cartel);
      border: 6px solid var(--color-borde);
      border-radius: 24px;
      padding: 36px 52px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: aparecer 0.3s ease-out;   /* efecto de "pop" al entrar */
    }

    #cartel-emoji  { font-size: 4rem; font-weight: bold; letter-spacing: 4px; }
    #cartel-titulo { font-size: 1.8rem; font-weight: bold; }
    .cartel .fila-botones { display: flex; gap: 12px; margin-top: 8px; }

    @keyframes aparecer {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Botón para silenciar / activar el sonido */
    #btn-sonido {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border: 3px solid var(--color-borde);
      border-radius: 50%;
      background: var(--color-celda);
      color: var(--color-texto);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
      z-index: 20;
    }
    #btn-sonido:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <!-- Botón para silenciar / activar el sonido (ícono SVG, sin emojis) -->
  <button id="btn-sonido" title="Activar / silenciar sonido"></button>

  <h1>
    <span id="titulo-perro"></span> La guerra de los Bigotes <span id="titulo-gato"></span>
    <span class="subtitulo">Perros VS Gatos</span>
  </h1>

  <!-- PANTALLA: MENÚ PRINCIPAL -->
  <div id="pantalla-menu" class="pantalla">
    <p style="font-size: 1.1rem;">Elegí un modo de juego:</p>
    <button id="btn-2jugadores" class="btn-grande">2 Jugadores</button>
    <button id="btn-cpu" class="btn-grande">Contra la CPU</button>
  </div>

  <!-- PANTALLA: ELEGIR PERSONAJE (modo CPU) -->
  <div id="pantalla-elegir" class="pantalla oculta">
    <p style="font-size: 1.1rem;">Elegí tu personaje:</p>
    <div id="opciones-personaje"></div>
    <button class="btn-secundario volver-menu">Volver al menú</button>
  </div>

  <!-- PANTALLA: JUEGO -->
  <div id="pantalla-juego" class="pantalla oculta">
    <div id="estado"></div>

    <div id="tablero"></div>

    <div id="marcador">
      <span><span id="nombre-izq"></span>: <span id="puntos-izq">0</span></span>
      <span>Empates: <span id="puntos-empate">0</span></span>
      <span><span id="nombre-der"></span>: <span id="puntos-der">0</span></span>
    </div>

    <button id="reiniciar" class="btn-grande">Jugar de nuevo</button>
    <button class="btn-secundario volver-menu">Menú principal</button>
  </div>

  <!-- CARTEL DE VICTORIA -->
  <div id="cartel-victoria" class="oculta">
    <div class="cartel">
      <div id="cartel-emoji"></div>
      <div id="cartel-titulo"></div>
      <div class="fila-botones">
        <button id="cartel-revancha" class="btn-grande">Revancha</button>
        <button id="cartel-menu" class="btn-secundario">Menú</button>
      </div>
    </div>
  </div>

    };

    // Personajes que aparecen para elegir en el modo CPU
    const PERSONAJES = [JUGADOR_1, JUGADOR_2];

    // Cuánto "piensa" la CPU antes de jugar (en milisegundos)
    const DEMORA_CPU = 600;

    /* ============================================
       PERSONALIZACIÓN DE SONIDOS
       ============================================ */
    let SONIDOS_ACTIVADOS = true;   // ponelo en false para silenciar todo
    const VOLUMEN = 0.3;            // volumen general, de 0.0 a 1.0

    /* ============================================
       ESTADO DEL JUEGO (no hace falta tocar)
       ============================================ */
    let tablero = Array(9).fill(null);
    let turno = JUGADOR_1;
    let juegoTerminado = false;
    let modoCPU = false;
    let personajeJugador = JUGADOR_1;
    let personajeCPU = JUGADOR_2;
    let partidaActual = 0;   // sirve para cancelar jugadas viejas de la CPU
    let puntos = { [JUGADOR_1]: 0, [JUGADOR_2]: 0, empate: 0 };

    // Todas las combinaciones posibles para ganar
    const LINEAS_GANADORAS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],  // filas
      [0, 3, 6], [1, 4, 7], [2, 5, 8],  // columnas
      [0, 4, 8], [2, 4, 6]              // diagonales
    ];

    const divEstado      = document.getElementById("estado");
    const divTablero     = document.getElementById("tablero");
    const cartelVictoria = document.getElementById("cartel-victoria");

    // Mete la imagen (o el nombre de respaldo) del jugador en un elemento
    function insertarSimbolo(contenedor, jugador) {
      const ruta = IMAGENES[jugador];
      if (ruta) {
        const imagen = document.createElement("img");
        imagen.src = ruta;
        imagen.alt = jugador;
        imagen.className = "simbolo-img";
        contenedor.appendChild(imagen);
      } else {
        contenedor.append(jugador);
      }
    }

    /* ---------- CAMBIAR DE PANTALLA ---------- */
    function mostrarPantalla(id) {
      document.querySelectorAll(".pantalla").forEach(p => p.classList.add("oculta"));
      document.getElementById(id).classList.remove("oculta");
      cartelVictoria.classList.add("oculta");
    }

    function volverAlMenu() {
      partidaActual++;   // cancela cualquier jugada de la CPU que esté pendiente
      reiniciarPuntos();
      mostrarPantalla("pantalla-menu");
    }

    function reiniciarPuntos() {
      puntos[JUGADOR_1] = 0;
      puntos[JUGADOR_2] = 0;
      puntos.empate = 0;
    }

    /* ---------- EMPEZAR UNA PARTIDA ---------- */
    function empezarPartida() {
      partidaActual++;
      tablero = Array(9).fill(null);
      juegoTerminado = false;

      // Se elige AL AZAR quién empieza
      turno = Math.random() < 0.5 ? JUGADOR_1 : JUGADOR_2;

      crearTablero();
      actualizarMarcador();
      mostrarTurno();
      cartelVictoria.classList.add("oculta");

      // Si le toca arrancar a la CPU, que juegue sola
      if (esTurnoCPU()) programarCPU();
    }

    function esTurnoCPU() {
      return modoCPU && turno === personajeCPU;
    }

    function crearTablero() {
      divTablero.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const boton = document.createElement("button");
        boton.className = "celda";
        boton.dataset.indice = i;
        boton.addEventListener("click", clicCelda);
        divTablero.appendChild(boton);
      }
    }

    function mostrarTurno() {
      divEstado.textContent = "";
      if (esTurnoCPU()) {
        divEstado.textContent = "La CPU está pensando...";
      } else {
        divEstado.append(modoCPU ? "Tu turno: " : "Turno de: ");
        insertarSimbolo(divEstado, turno);
      }
    }

    /* ---------- JUGAR ---------- */
    function clicCelda(evento) {
      const indice = Number(evento.currentTarget.dataset.indice);
      if (juegoTerminado || tablero[indice] !== null) return;
      if (esTurnoCPU()) return;   // no se puede clickear mientras juega la CPU
      colocarFicha(indice);
    }

    function colocarFicha(indice) {
      tablero[indice] = turno;
      const celda = divTablero.children[indice];
      celda.textContent = "";
      insertarSimbolo(celda, turno);   // imagen o texto de respaldo según el jugador
      sonidoFicha(turno);              // suena al colocar la ficha

      const linea = revisarGanador();
      if (linea) {
        juegoTerminado = true;
        puntos[turno]++;
        linea.forEach(i => divTablero.children[i].classList.add("ganadora"));
        divEstado.textContent = "¡Ganó el equipo " + turno + "!";
        actualizarMarcador();
        programarCartel(turno);
      } else if (tablero.every(celda => celda !== null)) {
        juegoTerminado = true;
        puntos.empate++;
        divEstado.textContent = "¡Empate!";
        actualizarMarcador();
        programarCartel(null);
      } else {
        // Cambiar el turno
        turno = (turno === JUGADOR_1) ? JUGADOR_2 : JUGADOR_1;
        mostrarTurno();
        if (esTurnoCPU()) programarCPU();
      }
    }

    function revisarGanador() {
      for (const linea of LINEAS_GANADORAS) {
        const [a, b, c] = linea;
        if (tablero[a] && tablero[a] === tablero[b] && tablero[a] === tablero[c]) {
          return linea;
        }
      }
      return null;
    }

    /* ---------- CARTEL DE VICTORIA ---------- */
    function programarCartel(ganador) {
      const partida = partidaActual;
      setTimeout(() => {
        if (partida !== partidaActual) return;   // se reinició antes de mostrarlo
        mostrarCartelVictoria(ganador);
      }, 800);
    }

    function mostrarCartelVictoria(ganador) {
      const simbolo = document.getElementById("cartel-emoji");
      const titulo  = document.getElementById("cartel-titulo");

      simbolo.textContent = "";
      if (ganador === null) {
        simbolo.textContent = "VS";    // en el empate queda el VS de la guerra
        titulo.textContent  = "¡Empate!";
      } else {
        insertarSimbolo(simbolo, ganador);
        if (modoCPU && ganador === personajeJugador) {
          titulo.textContent = "¡Ganaste!";
        } else if (modoCPU) {
          titulo.textContent = "¡Ganó la CPU!";
        } else {
          titulo.textContent = "¡Ganó el equipo " + ganador + "!";
        }
      }
      sonidoResultado(ganador);   // melodía de victoria / derrota / empate

      cartelVictoria.classList.remove("oculta");
    }

    /* ---------- SONIDOS ----------
       Los sonidos se generan con código (Web Audio API),
       así que el juego no necesita archivos de audio externos.
       Podés cambiar frecuencias, duraciones y tipos de onda:
       "sine" (suave), "square" (8-bit), "triangle", "sawtooth" */
    let contextoAudio = null;

    function obtenerContexto() {
      if (!contextoAudio) {
        contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (contextoAudio.state === "suspended") contextoAudio.resume();
      return contextoAudio;
    }

    // Reproduce un tono simple (frecuencia en Hz, duración en segundos)
    function tono(frecuencia, duracion, tipo = "sine", volumen = VOLUMEN, retraso = 0) {
      if (!SONIDOS_ACTIVADOS) return;
      const contexto = obtenerContexto();
      const inicio = contexto.currentTime + retraso;
      const oscilador = contexto.createOscillator();
      const ganancia = contexto.createGain();
      oscilador.type = tipo;
      oscilador.frequency.value = frecuencia;
      ganancia.gain.setValueAtTime(volumen, inicio);
      ganancia.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);
      oscilador.connect(ganancia);
      ganancia.connect(contexto.destination);
      oscilador.start(inicio);
      oscilador.stop(inicio + duracion);
    }

    const SONIDOS = {
      // Clic en cualquier botón del menú
      boton() { tono(600, 0.08, "square", VOLUMEN * 0.5); },

      // Cuando el equipo Perro coloca su ficha (tono grave)
      ficha1() { tono(320, 0.1, "triangle"); tono(240, 0.14, "triangle", VOLUMEN, 0.07); },

      // Cuando el equipo Gato coloca su ficha (tono agudo)
      ficha2() { tono(650, 0.1, "sine"); tono(850, 0.14, "sine", VOLUMEN, 0.07); },

      // Melodía de victoria (notas hacia arriba)
      victoria() { [523, 659, 784, 1047].forEach((f, i) => tono(f, 0.18, "triangle", VOLUMEN, i * 0.13)); },

      // Melodía si gana la CPU (notas hacia abajo)
      derrota() { [400, 330, 262, 196].forEach((f, i) => tono(f, 0.2, "sawtooth", VOLUMEN * 0.5, i * 0.16)); },

      // Sonido de empate
      empate() { tono(440, 0.12); tono(440, 0.25, "sine", VOLUMEN, 0.18); },
    };

    // Elige el sonido según qué equipo coloca la ficha
    function sonidoFicha(jugador) {
      if (jugador === JUGADOR_1) SONIDOS.ficha1();
      else SONIDOS.ficha2();
    }

    // Elige la melodía según cómo terminó la partida
    function sonidoResultado(ganador) {
      if (ganador === null) SONIDOS.empate();
      else if (modoCPU && ganador === personajeCPU) SONIDOS.derrota();
      else SONIDOS.victoria();
    }

    /* ---------- CEREBRO DE LA CPU ---------- */
    function programarCPU() {
      const partida = partidaActual;
      setTimeout(() => {
        if (partida !== partidaActual || juegoTerminado) return;
        moverCPU();
      }, DEMORA_CPU);
    }

    function moverCPU() {
      const indice = elegirMovimientoCPU();
      if (indice !== null) colocarFicha(indice);
    }

    // La CPU juega así: 1° gana si puede, 2° bloquea, 3° juega al azar
    function elegirMovimientoCPU() {
      // 1: si puede ganar la partida, la gana
      const ganar = buscarJugada(personajeCPU);
      if (ganar !== null) return ganar;

      // 2: si el jugador está por ganar, lo bloquea
      const bloquear = buscarJugada(personajeJugador);
      if (bloquear !== null) return bloquear;

      // 3: si no, juega un casillero libre al azar
      const libres = tablero
        .map((celda, i) => (celda === null ? i : null))
        .filter(i => i !== null);
      return libres[Math.floor(Math.random() * libres.length)];
    }

    // Busca una jugada donde "ficha" tenga 2 en línea y pueda completar la 3ra
    function buscarJugada(ficha) {
      for (const [a, b, c] of LINEAS_GANADORAS) {
        const valores = [tablero[a], tablero[b], tablero[c]];
        const cantidad = valores.filter(v => v === ficha).length;
        if (cantidad === 2 && valores.includes(null)) {
          return [a, b, c][valores.indexOf(null)];
        }
      }
      return null;
    }

    /* ---------- MARCADOR ---------- */
    function actualizarMarcador() {
      const nombreIzq = document.getElementById("nombre-izq");
      const nombreDer = document.getElementById("nombre-der");
      nombreIzq.textContent = "";
      nombreDer.textContent = "";

      if (modoCPU) {
        nombreIzq.append("Vos ");
        insertarSimbolo(nombreIzq, personajeJugador);
        nombreDer.append("CPU ");
        insertarSimbolo(nombreDer, personajeCPU);
      } else {
        insertarSimbolo(nombreIzq, JUGADOR_1);
        insertarSimbolo(nombreDer, JUGADOR_2);
      }

      document.getElementById("puntos-izq").textContent    = puntos[modoCPU ? personajeJugador : JUGADOR_1];
      document.getElementById("puntos-der").textContent    = puntos[modoCPU ? personajeCPU : JUGADOR_2];
      document.getElementById("puntos-empate").textContent = puntos.empate;
    }

    /* ---------- ÍCONO DE SONIDO (SVG, sin emojis) ---------- */
    const btnSonido = document.getElementById("btn-sonido");
    const ICONO_SONIDO_ON =
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';
    const ICONO_SONIDO_OFF =
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><line x1="16" y1="9" x2="22" y2="15"></line><line x1="22" y1="9" x2="16" y2="15"></line></svg>';

    function actualizarIconoSonido() {
      btnSonido.innerHTML = SONIDOS_ACTIVADOS ? ICONO_SONIDO_ON : ICONO_SONIDO_OFF;
    }

    /* ---------- CONEXIÓN DE BOTONES ---------- */

    // Botón para silenciar / activar el sonido (arriba a la derecha)
    btnSonido.addEventListener("click", () => {
      SONIDOS_ACTIVADOS = !SONIDOS_ACTIVADOS;
      actualizarIconoSonido();
      if (SONIDOS_ACTIVADOS) SONIDOS.boton();
    });

    // Menú principal
    document.getElementById("btn-2jugadores").addEventListener("click", () => {
      SONIDOS.boton();
      modoCPU = false;
      reiniciarPuntos();
      mostrarPantalla("pantalla-juego");
      empezarPartida();
    });

    document.getElementById("btn-cpu").addEventListener("click", () => {
      SONIDOS.boton();
      modoCPU = true;
      mostrarPantalla("pantalla-elegir");
    });

    // Elegir personaje: se crea un botón por cada personaje de la lista
    const divOpciones = document.getElementById("opciones-personaje");
    PERSONAJES.forEach(personaje => {
      const boton = document.createElement("button");
      boton.className = "btn-personaje";
      insertarSimbolo(boton, personaje);
      boton.addEventListener("click", () => {
        SONIDOS.boton();
        personajeJugador = personaje;
        // la CPU se queda con el personaje que sobra
        personajeCPU = (personaje === JUGADOR_1) ? JUGADOR_2 : JUGADOR_1;
        reiniciarPuntos();
        mostrarPantalla("pantalla-juego");
        empezarPartida();
      });
      divOpciones.appendChild(boton);
    });

    // Botones de la partida y del cartel
    document.getElementById("reiniciar").addEventListener("click", () => {
      SONIDOS.boton();
      empezarPartida();
    });

    document.getElementById("cartel-revancha").addEventListener("click", () => {
      SONIDOS.boton();
      cartelVictoria.classList.add("oculta");
      empezarPartida();
    });

    document.getElementById("cartel-menu").addEventListener("click", () => {
      SONIDOS.boton();
      volverAlMenu();
    });

    // Todos los botones "volver al menú"
    document.querySelectorAll(".volver-menu").forEach(boton => {
      boton.addEventListener("click", () => {
        SONIDOS.boton();
        volverAlMenu();
      });
    });

    /* ---------- ARRANQUE ---------- */
    // Pone las imágenes de los equipos en el título
    insertarSimbolo(document.getElementById("titulo-perro"), JUGADOR_1);
    insertarSimbolo(document.getElementById("titulo-gato"), JUGADOR_2);
    actualizarIconoSonido();
  </script>
</body>
</html>
