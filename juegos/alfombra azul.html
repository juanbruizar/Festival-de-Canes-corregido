    --fondo-pagina: #ffffff;   /* color de fondo de la página */
    --color-texto:  #535353;   /* color de textos y puntaje */
    --color-suelo:  #2e1572;   /* color de la alfombra (el suelo) */

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family: monospace;
    background:#1d1040;              /* color de respaldo mientras carga la foto */
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    user-select:none;              /* que no se seleccione texto al tocar */
  }

  /* ============================================================
     FONDO EN MOVIMIENTO: una "tira" fija detrás de todo con dos
     copias de la foto seguidas, que se desliza a la derecha y,
     al llegar al límite, reinicia el bucle.
     ✏️ Velocidad: cambiá los 40s de la animación de abajo.
     ============================================================ */
  #fondoMovil{
    position:fixed;
    inset:0;
    z-index:-2;                    /* detrás de todo el contenido */
    overflow:hidden;
    background:#1d1040;
  }
  #fondoMovil .tira{
    display:flex;
    height:100%;
    width:max-content;
    animation: bucleFondo 40s linear infinite;   /* ✏️ velocidad */
  }
  #fondoMovil .tramo{
    height:100%;
    width:max(100vw, 232vh);       /* cada copia ocupa el alto de la pantalla */
    flex-shrink:0;
    background-image:var(--foto);  /* la foto embebida */
    background-size:cover;
    background-position:center;
  }
  @keyframes bucleFondo{
    from{ transform:translateX(-50%); } /* arranca corrida una copia... */
    to{   transform:translateX(0); }    /* ...y al reiniciar coincide exacto */
  }

  /* Velo oscuro quieto sobre la foto, para que los textos se lean bien */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:-1;
    pointer-events:none;
  }

  /* Título y puntaje: ocupan el espacio libre de arriba y se centran ahí */
  #arriba{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  h1{
    font-size:20px;
    color:#ffffff;
    text-shadow:2px 2px 0 rgba(0,0,0,.8);  /* sombra para leerse sobre la foto */
    margin-bottom:10px;
    font-weight:normal;
    letter-spacing:2px;
  }

  #puntaje{
    font-size:22px;
    letter-spacing:4px;
    color:#ffffff;
    text-shadow:2px 2px 0 rgba(0,0,0,.8);  /* sombra para leerse sobre la foto */
    margin-bottom:8px;
    font-weight:bold;
  }

  /* Zona de juego. El "suelo" ahora es la alfombra azul (la banda de abajo),
     por eso acá ya no hay borde inferior */
  #juego{
    position:relative;
    width:min(92vw, var(--ancho-juego));
    height:var(--alto-juego);
    overflow:hidden;               /* los enemigos se ocultan al salir */
    touch-action:none;             /* evita scroll/zoom al tocar en el celu */
  }

  /* El perro. El emoji 🐕 mira a la izquierda, así que lo damos
     vuelta con scaleX(-1) para que mire hacia donde corre (derecha).
     ⚠ Si algún día usás una imagen que ya mira a la derecha, borrá eso. */
  #dino{
    position:absolute;
    left:60px;                     /* ⚠ tiene que coincidir con CONFIG.posicionDino */
    bottom:0;
    transform:scaleX(-1);
    transform-origin:bottom center; /* para que se "aplasté" contra el suelo */
    transition:transform .08s;      /* suaviza el cambio al agacharse */
    line-height:1;
    pointer-events:none;
  }

  /* Dino agachado: se aplasta. El 0.55 tiene que coincidir con
     CONFIG.factorAgachado en el JS (si cambiás uno, cambiá el otro) */
  #dino.agachado{
    transform:scaleX(-1) scaleY(0.55);
  }

  /* Si usás una imagen/GIF en vez de emoji (CONFIG.imagenDino):
     NO se da vuelta horizontalmente (se asume que ya mira a la derecha) */
  #dino.usa-imagen{ transform:none; }
  #dino.usa-imagen.agachado{ transform:scaleY(0.55); }

  /* Los enemigos (cactus y voladores) se crean desde el JS */
  .enemigo{
    position:absolute;
    bottom:0;
    line-height:1;
    pointer-events:none;
  }

  /* Animación de "aleteo" para los voladores (sube y baja un poquito) */
  .volador{ animation: aletear .35s infinite alternate ease-in-out; }
  @keyframes aletear{
    from{ transform:translateY(0); }
    to{   transform:translateY(-5px); }
  }

  /* Que el pixel art se vea bien definido al agrandarse (sin borrosidad) */
  #dino img, .enemigo img{
    image-rendering:pixelated;
  }

  /* Cuando perdés, el fondo se congela (el JS le agrega esta clase al body) */
  body.fondo-congelado #fondoMovil .tira{
    animation-play-state:paused;
  }

  /* Mensajes de inicio / game over */
  #mensaje{
    position:absolute;
    top:25%;
    width:100%;
    text-align:center;
    color:#ffffff;
    text-shadow:2px 2px 0 rgba(0,0,0,.8);
    font-size:17px;
    font-weight:bold;
    line-height:1.7;
  }

  /* Cartel de victoria (el JS lo muestra cuando ganás) */
  #victoria{
    display:none;
    position:absolute;
    top:12%;
    left:50%;
    transform:translateX(-50%);
    background:var(--fondo-pagina);
    border:2px solid var(--color-texto);
    border-radius:12px;
    padding:14px 22px;
    text-align:center;
    color:var(--color-texto);
    line-height:1.6;
    z-index:10;                  /* por encima de los enemigos */
  }
  #victoria .titulo{ font-size:20px; }
  #victoria button{
    margin:10px 4px 0;
    padding:8px 14px;
    border:2px solid var(--color-texto);
    border-radius:8px;
    background:transparent;
    color:var(--color-texto);
    font-family:monospace;
    font-size:12px;
    cursor:pointer;
  }
  #victoria button:hover{
    background:var(--color-texto);
    color:var(--fondo-pagina);
  }

  /* La alfombra azul: banda gruesa que cubre toda la parte inferior
     de la pantalla, de borde a borde. Cambiá su altura con
     --alto-alfombra en :root */
  #alfombra{
    width:100%;
    height:var(--alto-alfombra);
    background:var(--color-suelo);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Botón para agacharse (queda sobre la alfombra, fondo azul).
     Si no lo querés, borrá este bloque y el <div id="botonAgachar"> */
  #botonAgachar{
    padding:8px 24px;
    border:2px solid #ffffff;
    border-radius:8px;
    background:transparent;
    color:#ffffff;
    font-family:monospace;
    font-size:14px;
    letter-spacing:2px;
    cursor:pointer;
    touch-action:none;
    user-select:none;
  }
  #botonAgachar:active{
    background:#ffffff;
    color:var(--color-suelo);
  }
</style>
</head>

  const CONFIG = {

  const aspectos = { dino: 1, cactus: 1, volador: 1 };
  function precargarAspecto(url, clave){
    if (!url) return;
    const img = new Image();
    img.onload = () => aspectos[clave] = img.naturalWidth / img.naturalHeight;
    img.src = url;
  }
  precargarAspecto(CONFIG.imagenDino,    "dino");
  precargarAspecto(CONFIG.imagenCactus,  "cactus");
  precargarAspecto(CONFIG.imagenVolador, "volador");

  // Devuelve un <img> listo para usar (o null si no hay imagen configurada)
  function crearImagen(url, tamAlto){
    if (!url) return null;
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.draggable = false;
    img.style.height = tamAlto + "px";
    img.style.width  = "auto";        // mantiene la proporción de la imagen
    img.style.display = "block";
    return img;
  }

  let estado = "esperando";      // "esperando" | "jugando" | "gano" | "perdido"
  let yaGano = false;            // para que la victoria aparezca 1 sola vez por partida
  let posY   = 0;                // altura del dino (0 = en el suelo)
  let velY   = 0;                // velocidad vertical del salto
  let agachado = false;          // true mientras se mantiene apretada ↓
  let velocidad = CONFIG.velocidadInicial;
  let puntaje = 0;
  let enemigos = [];             // { el, x, ancho, alto, baseY }
  let distanciaDesdeUltimo = 0;
  let proximaDistancia = 450;
  let rafId;

  /* ---------- Sonidos (recreación por código de los del juego original:
     no necesitan archivos y funcionan sin internet) ---------- */
  let audioCtx = null;
  let proximoHito = CONFIG.hitoCada;  // próximo puntaje donde suena el "ding"

  // Genera un tonito: frecuencia inicial/final, duración, tipo de onda y volumen
  function bip(freqIni, freqFin, dur, tipo, vol, retardo){
    if (!CONFIG.sonidos) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime + retardo;
    const osc = audioCtx.createOscillator();
    const volNodo = audioCtx.createGain();
    osc.type = tipo;
    osc.frequency.setValueAtTime(freqIni, t0);
    if (freqFin !== freqIni)
      osc.frequency.exponentialRampToValueAtTime(freqFin, t0 + dur);
    volNodo.gain.setValueAtTime(vol, t0);
    volNodo.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); // apagado suave
    osc.connect(volNodo).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }

  // ✏️ Cambiá frecuencias/duraciones acá para retocar los sonidos
  const Sonido = {
    salto(){   bip(500, 850, 0.1, "square", 0.045, 0); },   // "bip" ascendente
    golpe(){                                                // choque descendente
      bip(300, 90, 0.3, "sawtooth", 0.06, 0);
      bip(150, 60, 0.3, "square", 0.05, 0);
    },
    puntos(){  bip(1050, 1400, 0.09, "sine", 0.06, 0); },   // "ding" cada 100
    victoria(){                                             // fanfarria (extra)
      bip(523, 523, 0.12, "square", 0.05, 0);
      bip(659, 659, 0.12, "square", 0.05, 0.13);
      bip(784, 784, 0.22, "square", 0.05, 0.26);
    },
  };

  /* ---------- Saltar ---------- */
  function saltar(){
    if (posY === 0){             // solo salta si está en el suelo
      velY = CONFIG.fuerzaSalto;
      Sonido.salto();
    }
  }

  /* ---------- Agacharse (true = agacha, false = se levanta) ---------- */
  function agacharse(valor){
    agachado = valor;
    dino.classList.toggle("agachado", valor);
  }

  /* ---------- Crear un cactus (en el suelo) ---------- */
  function crearCactus(){
    const el = document.createElement("div");
    el.className = "enemigo";

    // Tamaño aleatorio (o fijo si variedadCactus = false)
    let escala = 1;
    if (CONFIG.variedadCactus) escala = 0.7 + Math.random() * 0.8;
    const alto = CONFIG.tamanoCactus * escala;
    const ancho = alto * aspectos.cactus;   // ancho real según la imagen

    // Imagen si está configurada, si no, emoji
    const img = crearImagen(CONFIG.imagenCactus, alto);
    if (img) el.appendChild(img);
    else { el.textContent = CONFIG.emojiCactus; el.style.fontSize = alto + "px"; }

    const xInicial = juego.clientWidth;
    el.style.left = xInicial + "px";
    juego.appendChild(el);
    enemigos.push({ el, x: xInicial, ancho: ancho, alto: alto, baseY: 0 });
  }

  /* ---------- Crear un enemigo volador (a una altura aleatoria) ---------- */
  function crearVolador(){
    const el = document.createElement("div");
    el.className = "enemigo volador";

    const alto = CONFIG.tamanoVolador;
    const ancho = alto * aspectos.volador;

    // Imagen si está configurada, si no, emoji
    const img = crearImagen(CONFIG.imagenVolador, alto);
    if (img) el.appendChild(img);
    else { el.textContent = CONFIG.emojiVolador; el.style.fontSize = alto + "px"; }

    // Elige una altura al azar de la lista del CONFIG
    const alturas = CONFIG.alturasVolador;
    const baseY = alturas[Math.floor(Math.random() * alturas.length)];
    el.style.bottom = baseY + "px";

    const xInicial = juego.clientWidth;
    el.style.left = xInicial + "px";
    juego.appendChild(el);
    enemigos.push({ el, x: xInicial, ancho: ancho, alto: alto, baseY: baseY });
  }

  /* ---------- Detectar colisión ---------- */
  function hayColision(){
    const margen = 6; // achica la zona de choque para que sea más justa
    const altoDino = CONFIG.tamanoDino * (agachado ? CONFIG.factorAgachado : 1);

    const anchoDino = CONFIG.tamanoDino * aspectos.dino;   // ancho real del personaje
    const dIzq    = CONFIG.posicionDino + margen;                // dino: izquierda
    const dDer    = CONFIG.posicionDino + anchoDino - margen;    // dino: derecha
    const dAbajo  = posY + margen;                                // dino: abajo
    const dArriba = posY + altoDino - margen;                     // dino: arriba

    for (const o of enemigos){
      const chocaX = (o.x + o.ancho - margen > dIzq) && (o.x + margen < dDer);
      const chocaY = (dArriba > o.baseY + margen) && (dAbajo < o.baseY + o.alto - margen);
      if (chocaX && chocaY) return true;
    }
    return false;
  }

  /* ---------- Bucle principal (se ejecuta ~60 veces por segundo) ---------- */
  function loop(){
    // 1) Física del salto (agacharse en el aire = caída rápida)
    if (posY > 0 || velY > 0){
      posY += velY;
      velY -= CONFIG.gravedad * (agachado ? CONFIG.caidaRapida : 1);
      if (posY <= 0){ posY = 0; velY = 0; }
      dino.style.bottom = posY + "px";
    }

    // 2) Mover los enemigos hacia la izquierda
    for (const o of enemigos) o.x -= velocidad;
    enemigos = enemigos.filter(o => {
      if (o.x < -100){ o.el.remove(); return false; } // fuera de pantalla: se borra
      o.el.style.left = o.x + "px";
      return true;
    });

    // 3) Crear enemigos nuevos con distancia aleatoria
    distanciaDesdeUltimo += velocidad;
    if (distanciaDesdeUltimo > proximaDistancia){
      const hayVoladores = puntaje >= CONFIG.puntosParaVoladores;
      if (hayVoladores && Math.random() < CONFIG.probabilidadVolador) crearVolador();
      else crearCactus();

      distanciaDesdeUltimo = 0;
      proximaDistancia = CONFIG.distanciaMinEnemigos +
        Math.random() * (CONFIG.distanciaMaxEnemigos - CONFIG.distanciaMinEnemigos);
    }

    // 4) Acelerar de a poco
    velocidad += CONFIG.aumentoVelocidad;

    // 5) Sumar puntos (y sonar un "ding" cada CONFIG.hitoCada puntos)
    puntaje += 0.2;
    puntajeEl.textContent = Math.floor(puntaje).toString().padStart(5, "0");
    if (Math.floor(puntaje) >= proximoHito){
      Sonido.puntos();
      proximoHito += CONFIG.hitoCada;
    }

    // 6) ¿Llegó a la meta? (se revisa ANTES de la colisión, así si gana
    //    y choca en el mismo instante, cuenta como victoria)
    if (!yaGano && CONFIG.puntosParaGanar > 0 && puntaje >= CONFIG.puntosParaGanar){
      ganar(); return;
    }

    // 7) Verificar colisión
    if (hayColision()){ perder(); return; }

    rafId = requestAnimationFrame(loop);
  }

  /* ---------- Empezar / reiniciar ---------- */
  function empezar(){
    cancelAnimationFrame(rafId);
    enemigos.forEach(o => o.el.remove());
    enemigos = [];
    posY = 0; velY = 0;
    agacharse(false);
    yaGano = false;
    victoriaEl.style.display = "none";
    document.body.classList.remove("fondo-congelado");  // el fondo vuelve a moverse
    dino.style.bottom = "0px";
    velocidad = CONFIG.velocidadInicial;
    puntaje = 0;
    puntajeEl.textContent = "00000";
    proximoHito = CONFIG.hitoCada;
    distanciaDesdeUltimo = 0;
    proximaDistancia = 450;
    mensajeEl.style.display = "none";
    estado = "jugando";
    rafId = requestAnimationFrame(loop);
  }

  /* ---------- Perder ---------- */
  function perder(){
    estado = "perdido";
    agacharse(false);
    Sonido.golpe();
    document.body.classList.add("fondo-congelado");  // congela el fondo
    mensajeEl.innerHTML = "💀 ¡PERDISTE!<br><small>ESPACIO o un toque para reintentar</small>";
    mensajeEl.style.display = "block";
  }

  /* ---------- Ganar: pausar y mostrar el cartel con opciones ---------- */
  function ganar(){
    estado = "gano";
    yaGano = true;               // que no vuelva a aparecer en esta partida
    agacharse(false);
    Sonido.victoria();
    victoriaEl.style.display = "block";
  }

  /* ---------- Seguir jugando infinitamente después de ganar ---------- */
  function seguirJugando(){
    victoriaEl.style.display = "none";
    // Limpiamos los enemigos en pantalla: como el juego estuvo pausado
    // en el cartel, así no revivís en una situación imposible
    enemigos.forEach(o => o.el.remove());
    enemigos = [];
    distanciaDesdeUltimo = 0;
    proximaDistancia = 450;
    estado = "jugando";
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  /* ---------- Controles ---------- */
  function accion(){ // saltar / seguir tras ganar / empezar / reintentar
    if (estado === "jugando") saltar();
    else if (estado === "gano") seguirJugando();
    else empezar();
  }

  // Teclado
  document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp"){
      e.preventDefault(); // que la barra espaciadora no haga scroll
      accion();
    }
    if (e.code === "ArrowDown"){
      e.preventDefault();
      if (estado === "jugando") agacharse(true);
    }
  });
  document.addEventListener("keyup", e => {
    if (e.code === "ArrowDown") agacharse(false);
  });

  // Tocar la zona de juego = saltar
  juego.addEventListener("pointerdown", accion);

  // Botón de agacharse (celular / mouse): mantener apretado = agachado
  botonAgachar.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (estado === "jugando") agacharse(true);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(evt =>
    botonAgachar.addEventListener(evt, () => agacharse(false))
  );

  // Botones del cartel de victoria
  // (stopPropagation para que el toque no cuente también como salto)
  btnSeguir.addEventListener("pointerdown", e => {
    e.stopPropagation();
    seguirJugando();
  });
  btnReiniciar.addEventListener("pointerdown", e => {
    e.stopPropagation();
    victoriaEl.style.display = "none";
    empezar();
  });
</script>
</body>
</html>
