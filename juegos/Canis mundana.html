// Botones de la pantalla de victoria (posición y tamaño)
const BTN_CONTINUAR  = { x: 70, y: 340, w: 260, h: 50 };
const BTN_REINTENTAR = { x: 70, y: 405, w: 260, h: 50 };

// --- Estado del juego ---
let pelota, edificios, puntos, estado, modoInfinito;

function reiniciar() {
  // ★ La pelota empieza ARRIBA (y: 150) para no tapar el título
  pelota = { x: 80, y: 150, vel: 0 };
  edificios = [];
  edificios.push(nuevoEdificio(W + 50));  // primer edificio
  puntos = 0;
  modoInfinito = false;
  estado = "inicio";  // "inicio" | "jugando" | "fin" | "victoria"
}

function nuevoEdificio(x) {
  // Altura aleatoria del hueco
  const minY = 80;
  const maxY = H - CONFIG.sueloAlto - CONFIG.hueco - 80;
  const huecoY = Math.random() * (maxY - minY) + minY;
  return { x: x, huecoY: huecoY, paso: false };
}

// =====================================================
//  ★★★  SONIDOS (generados por código, sin archivos) ★★★
//  Si quieres cambiarlos, toca las frecuencias de abajo.
// =====================================================
let audioCtx = null;

function audio() {
  // Crea el contexto de audio la primera vez (los navegadores
  // exigen que sea después de que el jugador toque algo)
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// Rebote estilo pelota de tenis: golpe corto y grave ("thock")
function sonidoRebote() {
  const ac = audio();
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(340, t);                    // ★ tono inicial
  osc.frequency.exponentialRampToValueAtTime(130, t + 0.09); // ★ cae a tono grave
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);  // se apaga rápido
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + 0.13);
}

// Punto al pasar un obstáculo: "ding" alegre de dos notas
function sonidoPunto() {
  const ac = audio();
  nota(ac, 660, 0, 0.09);      // ★ primera nota (Mi)
  nota(ac, 880, 0.09, 0.16);   // ★ segunda nota (La)
}

// Una nota simple (la usa sonidoPunto)
function nota(ac, frecuencia, espera, duracion) {
  const t = ac.currentTime + espera;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = "sine";
  osc.frequency.value = frecuencia;
  gain.gain.setValueAtTime(0.35, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duracion);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + duracion + 0.02);
}
// =====================================================


// --- Física ---
function actualizar() {
  if (estado === "jugando") {
    // Pelota: cae por gravedad
    pelota.vel += CONFIG.gravedad;
    pelota.y += pelota.vel;

    // Edificios: se mueven a la izquierda
    for (const e of edificios) {
      e.x -= CONFIG.velocidad;

      // Sumar punto al pasar el edificio
      if (!e.paso && e.x + CONFIG.edificioAncho < pelota.x) {
        e.paso = true;
        puntos++;
        sonidoPunto();  // ★ suena al pasar el obstáculo

        // ¿Llegó a la meta? → pantalla de victoria (salvo modo infinito)
        if (!modoInfinito && puntos >= CONFIG.meta) {
          estado = "victoria";
        }
      }
    }

    // Agregar edificio nuevo / borrar el que salió
    const ultimo = edificios[edificios.length - 1];
    if (ultimo.x < W - CONFIG.edificioEspacio) {
      edificios.push(nuevoEdificio(W));
    }
    if (edificios[0].x + CONFIG.edificioAncho < 0) {
      edificios.shift();
    }

    // ¿Chocó? → fin del juego
    if (hayChoque()) {
      estado = "fin";
    }
  }
}

function hayChoque() {
  const r = CONFIG.pelotaRadio;

  // Toca el suelo o el techo
  if (pelota.y + r >= H - CONFIG.sueloAlto) return true;
  if (pelota.y - r <= 0) return true;

  // Toca un edificio
  for (const e of edificios) {
    const dentroX = pelota.x + r > e.x && pelota.x - r < e.x + CONFIG.edificioAncho;
    const fueraHueco = pelota.y - r < e.huecoY || pelota.y + r > e.huecoY + CONFIG.hueco;
    if (dentroX && fueraHueco) return true;
  }
  return false;
}

// --- Dibujo ---
function dibujar() {
  // Fondo (cielo)
  ctx.fillStyle = CONFIG.colorFondo;
  ctx.fillRect(0, 0, W, H);

  // Edificios (uno arriba y uno abajo, con un hueco en el medio)
  for (const e of edificios) {
    // Edificio de arriba (cuelga desde el techo)
    dibujarEdificio(e.x, 0, CONFIG.edificioAncho, e.huecoY, "abajo");
    // Edificio de abajo (sube desde el suelo)
    const abajoY = e.huecoY + CONFIG.hueco;
    dibujarEdificio(e.x, abajoY, CONFIG.edificioAncho, H - abajoY - CONFIG.sueloAlto, "arriba");
  }

  // Suelo
  ctx.fillStyle = CONFIG.colorSuelo;
  ctx.fillRect(0, H - CONFIG.sueloAlto, W, CONFIG.sueloAlto);
  ctx.fillStyle = CONFIG.colorBorde;
  ctx.fillRect(0, H - CONFIG.sueloAlto, W, 3);  // línea superior del suelo

  // Pelota: dibuja la imagen de tenis (y un círculo simple
  // como respaldo mientras la imagen termina de cargar)
  const r = CONFIG.pelotaRadio;
  if (imgPelota.complete && imgPelota.naturalWidth > 0) {
    ctx.drawImage(imgPelota, pelota.x - r, pelota.y - r, r * 2, r * 2);
  } else {
    ctx.fillStyle = CONFIG.colorPelota;
    ctx.beginPath();
    ctx.arc(pelota.x, pelota.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Puntaje
  ctx.fillStyle = CONFIG.colorTexto;
  ctx.textAlign = "center";
  ctx.font = "bold 40px Arial";
  ctx.fillText(puntos, W / 2, 60);
  // Progreso hacia la meta (si no es modo infinito)
  if (!modoInfinito && (estado === "jugando" || estado === "inicio")) {
    ctx.font = "16px Arial";
    ctx.fillText("META: " + CONFIG.meta, W / 2, 85);
  }
  if (modoInfinito) {
    ctx.font = "16px Arial";
    ctx.fillText("MODO INFINITO", W / 2, 85);
  }

  // Pantallas de mensajes
  if (estado === "inicio") {
    ctx.font = "bold 32px Arial";
    ctx.fillText("CANIS MUNDANA", W / 2, H / 2 - 30);
    ctx.font = "18px Arial";
    ctx.fillText("Toca o pulsa ESPACIO", W / 2, H / 2 + 10);
    ctx.fillText("para empezar", W / 2, H / 2 + 35);
  } else if (estado === "fin") {
    ctx.font = "bold 24px Arial";
    ctx.fillText("¡Perdiste! Puntos: " + puntos, W / 2, H / 2 - 15);
    ctx.font = "18px Arial";
    ctx.fillText("Toca para jugar de nuevo", W / 2, H / 2 + 15);
  } else if (estado === "victoria") {
    dibujarVictoria();
  }
}

// Dibuja UN edificio con ventanas.
// ladoHueco = "abajo" si el hueco está debajo (edificio de arriba),
//             "arriba" si el hueco está encima (edificio de abajo).
function dibujarEdificio(x, y, w, h, ladoHueco) {
  // Cuerpo del edificio
  ctx.fillStyle = CONFIG.colorEdificio;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = CONFIG.colorBorde;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);

  // Ventanas: cuadraditos oscuros en filas y columnas
  // ★ Puedes cambiar ventW / ventH para ventanas más grandes o chicas
  ctx.fillStyle = CONFIG.colorBorde;
  const ventW = 12, ventH = 14;
  for (let wy = y + 10; wy + ventH <= y + h - 8; wy += 26) {
    for (let wx = x + 9; wx + ventW <= x + w - 6; wx += 24) {
      ctx.fillRect(wx, wy, ventW, ventH);
    }
  }

  // Techo: franja oscura del lado del hueco (marca bien la abertura)
  ctx.fillStyle = CONFIG.colorBorde;
  if (ladoHueco === "abajo") {
    ctx.fillRect(x, y + h - 6, w, 6);   // borde inferior
  } else {
    ctx.fillRect(x, y, w, 6);           // borde superior
  }
}

function dibujarVictoria() {
  // Panel
  ctx.fillStyle = CONFIG.colorFondo;
  ctx.strokeStyle = CONFIG.colorBorde;
  ctx.lineWidth = 4;
  ctx.fillRect(40, 180, 320, 300);
  ctx.strokeRect(40, 180, 320, 300);

  // Textos
  ctx.fillStyle = CONFIG.colorTexto;
  ctx.textAlign = "center";
  ctx.font = "bold 36px Arial";
  ctx.fillText("¡VICTORIA!", W / 2, 240);
  ctx.font = "18px Arial";
  ctx.fillText("Pasaste " + CONFIG.meta + " obstáculos", W / 2, 275);
  ctx.fillText("¿Qué quieres hacer?", W / 2, 300);

  // Botones
  dibujarBoton(BTN_CONTINUAR, "CONTINUAR (∞)");
  dibujarBoton(BTN_REINTENTAR, "REINTENTAR");
}

function dibujarBoton(b, texto) {
  ctx.fillStyle = CONFIG.colorBorde;   // botón oscuro
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = CONFIG.colorFondo;   // texto claro
  ctx.font = "bold 20px Arial";
  ctx.textAlign = "center";
  ctx.fillText(texto, b.x + b.w / 2, b.y + 33);
}

// ¿El clic (x, y) cayó dentro del botón?
function clicEnBoton(b, x, y) {
  return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
}

// --- Controles ---
function saltar() {
  pelota.vel = CONFIG.salto;
  sonidoRebote();  // ★ suena cada vez que la pelota rebota
}

function accion(x, y) {
  if (estado === "inicio") {
    estado = "jugando";
    saltar();
  } else if (estado === "jugando") {
    saltar();
  } else if (estado === "fin") {
    reiniciar();                // empezar de nuevo
    estado = "jugando";
  } else if (estado === "victoria") {
    if (x === undefined) {
      continuarInfinito();      // tecla: continuar por defecto
    } else if (clicEnBoton(BTN_CONTINUAR, x, y)) {
      continuarInfinito();
    } else if (clicEnBoton(BTN_REINTENTAR, x, y)) {
      reiniciar();
      estado = "jugando";
    }
    // (clic fuera de los botones = no hace nada)
  }
}

function continuarInfinito() {
  modoInfinito = true;
  estado = "jugando";
}

// Convertir clic táctil/ratón a coordenadas del canvas
function coordsCanvas(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (cx - rect.left) * (canvas.width / rect.width),
    y: (cy - rect.top) * (canvas.height / rect.height),
  };
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); accion(); }
  if (e.code === "KeyR" && (estado === "fin" || estado === "victoria")) {
    reiniciar();
    estado = "jugando";
  }
});
canvas.addEventListener("mousedown", (e) => {
  const p = coordsCanvas(e);
  accion(p.x, p.y);
});
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const p = coordsCanvas(e);
  accion(p.x, p.y);
});

// --- Bucle principal ---
function bucle() {
  actualizar();
  dibujar();
  requestAnimationFrame(bucle);
}

reiniciar();
bucle();
</script>
